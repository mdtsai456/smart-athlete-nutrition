# Copy into your repository's GitHub Actions workflow directory.
# Deliverable files are expected at repository root. Uses disposable credentials.
name: MariaDB schema integration
on:
  push:
  pull_request:
jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-test.txt
      - run: docker compose up -d --wait
      - run: python tests/run_integration.py
        env:
          MVP_DB_PASSWORD: integration-only
          MVP_DB_NAME: mvp_test_ci
      - if: always()
        run: docker compose down -v
